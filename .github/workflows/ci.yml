name: Website

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  contract-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check API catalog vs OpenAPI snapshot
        # 使用仓库内 docs/openapi.snapshot.yaml（不依赖跨仓 checkout）
        run: npm run check:api

      - name: Build
        run: npm run build
